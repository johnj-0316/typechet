<nav>
    <ul class="nav-bar">
        <li class="logo">
            <a>typechet</a>
        </li>
        @for (item of landingItems; track item.label) {
            @if ("path" in item) {
                <li [class]="'nav-item ' + (item.class ?? '')">
                    <a [routerLink]="item.path">{{ item.label }}</a>
                </li>
            }
        }
    </ul>
</nav>
