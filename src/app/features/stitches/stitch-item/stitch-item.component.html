<div class="stitch-item">
    <div class="stitch-left">
        @if (!custom()) {
            <svg class="stitch-icon" lucidePin></svg>
        }
        <p [class]="customStyle()">
            {{ shorthand() }}
        </p>
    </div>
    <p class="stitch-name">{{ name() }}</p>
    <p class="stitch-origin">{{ origin() }}</p>
</div>
