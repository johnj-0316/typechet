<div class="pattern-grid">
    @for (pattern of patterns()?.data; track pattern.id) {
        <tc-pattern-item 
            [title]="pattern.title"
            [date]="pattern.created_at | date: 'MMMM d, yyyy'"
        ></tc-pattern-item>
    }
</div>
